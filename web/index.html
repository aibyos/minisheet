<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniSheet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='4' width='52' height='56' rx='8' fill='%23188038'/%3E%3Crect x='15' y='18' width='34' height='30' rx='2' fill='%23fff'/%3E%3Cpath d='M15 28h34M15 38h34M27 18v30' stroke='%23188038' stroke-width='3'/%3E%3C/svg%3E">
<script src="xlsx.full.min.js"></script>
<style>
:root{
  --bg:#ffffff; --fg:#1f1f1f; --muted:#5f6368; --chrome:#f9fbfd; --field:#edf2fa; --border:#c7c7c7; --line:#e2e2e2;
  --head:#f8f9fa; --head-fg:#575a5e; --head-sel:#d3e3fd; --head-sel-fg:#0b57d0; --on-accent:#ffffff;
  --accent:#1a73e8; --sel:rgba(14,101,235,.10); --input:#ffffff; --hover:rgba(68,71,70,.08); --btn-on:#d3e3fd;
  --fm:#fff0a3; --fc:#ffc94d; --menu:#ffffff; --err:#d93025; --freeze:#c0c0c0;
  --shadow:0 4px 16px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1c1e; --fg:#e3e3e3; --muted:#a0a4a8; --chrome:#202124; --field:#2b2c2f; --border:#4a4c50; --line:#323336;
    --head:#242528; --head-fg:#a8acb1; --head-sel:#2d3f5e; --head-sel-fg:#a8c7fa; --on-accent:#1b1c1e;
    --accent:#8ab4f8; --sel:rgba(138,180,248,.16); --input:#1b1c1e; --hover:rgba(255,255,255,.08); --btn-on:#2d3f5e;
    --fm:#5c4f00; --fc:#8a6d00; --menu:#2b2c2f; --err:#f28b82; --freeze:#5a5c60;
    --shadow:0 4px 16px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1c1e; --fg:#e3e3e3; --muted:#a0a4a8; --chrome:#202124; --field:#2b2c2f; --border:#4a4c50; --line:#323336;
  --head:#242528; --head-fg:#a8acb1; --head-sel:#2d3f5e; --head-sel-fg:#a8c7fa; --on-accent:#1b1c1e;
  --accent:#8ab4f8; --sel:rgba(138,180,248,.16); --input:#1b1c1e; --hover:rgba(255,255,255,.08); --btn-on:#2d3f5e;
  --fm:#5c4f00; --fc:#8a6d00; --menu:#2b2c2f; --err:#f28b82; --freeze:#5a5c60;
  --shadow:0 4px 16px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{display:flex;flex-direction:column;background:var(--chrome);color:var(--fg);
  font:13px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px 2px}
.logo{width:30px;height:34px;flex:none}
.titlecol{display:flex;flex-direction:column;min-width:0;flex:1}
.titlerow{display:flex;align-items:center;gap:10px}
#title{font:inherit;font-size:17px;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:4px;padding:1px 6px;margin-left:-6px;min-width:60px;max-width:420px}
#title:hover{border-color:var(--border)}
#title:focus{outline:none;border-color:var(--accent)}
#savestate{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menubar{display:flex;gap:0;margin-left:-6px}
.menubar button{background:none;border:0;padding:2px 7px;border-radius:4px;font-size:13.5px;cursor:default}
.menubar button:hover,.menubar button.open{background:var(--hover)}
.themeseg{display:flex;gap:2px;padding:3px;background:var(--field);border-radius:10px;align-self:flex-start;margin-top:2px;flex:none}
.themeseg button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;border-radius:7px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:default}
.themeseg button:hover{color:var(--fg)}
.themeseg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.gearbtn{flex:none;align-self:flex-start;margin:2px 0 0 6px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:var(--field);color:var(--muted);cursor:default}
.gearbtn:hover{color:var(--fg)}
.gearbtn[hidden]{display:none}
.gearbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.themeseg svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:760px){.themeseg span{display:none}.themeseg button{padding:4px 7px}}

.toolbar{display:flex;align-items:center;gap:2px;margin:6px 10px 6px;padding:3px 8px;background:var(--field);border-radius:24px;min-height:38px;flex-wrap:wrap}
.toolbar button{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 5px;border:0;background:none;border-radius:4px;cursor:default}
.toolbar button:hover{background:var(--hover)}
.toolbar button.on{background:var(--btn-on);color:var(--head-sel-fg)}
.toolbar button:disabled{opacity:.35}
.toolbar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toolbar .txt{font-size:12.5px;padding:0 8px;gap:5px}
.toolbar .sepv{width:1px;height:20px;background:var(--border);margin:0 5px}
.toolbar b.glyph{font-size:15px;font-weight:700;font-family:Georgia,serif}
.toolbar i.glyph{font-size:16px;font-family:Georgia,serif}
.swatch-bar{display:block;width:16px;height:3px;border-radius:1px;margin-top:1px}

/* ---------- formula bar ---------- */
.fbar{display:flex;align-items:center;height:30px;background:var(--bg);border-top:1px solid var(--border)}
#namebox{width:96px;height:100%;border:0;border-right:1px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;padding:0 10px;text-align:left}
#namebox:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.fxlabel{color:var(--muted);font:italic 14px Georgia,serif;padding:0 10px;border-right:1px solid var(--border);height:100%;display:flex;align-items:center}
#formula{flex:1;height:100%;border:0;background:var(--bg);color:var(--fg);font:13px ui-monospace,SFMono-Regular,Menlo,monospace;padding:0 10px}
#formula:focus{outline:none}

/* ---------- grid ---------- */
#wrap{flex:1;overflow:auto;position:relative;background:var(--bg);border-top:1px solid var(--border);overscroll-behavior:none}
#grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;user-select:none;-webkit-user-select:none;cursor:cell}
#grid td,#grid th{height:22px;padding:0 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;line-height:21px;text-overflow:clip}
#grid td{position:relative;color:var(--fg);background:var(--bg)}
#grid td.n{text-align:right}
#grid.nogrid td{border-right-color:transparent;border-bottom-color:transparent}
#grid td.mgi{border-bottom-color:transparent}
#grid td.c{text-align:center}
#grid td.err{color:var(--err)}
#grid thead th{position:sticky;top:0;z-index:4;height:24px;line-height:23px;background:var(--head);color:var(--head-fg);font-weight:500;font-size:11px;text-align:center;border-color:var(--border);border-right-color:var(--line);cursor:default}
#grid thead th.corner{left:0;z-index:6;border-right-color:var(--border);cursor:default}
#grid th.rh{position:sticky;left:0;z-index:3;background:var(--head);color:var(--head-fg);font-size:11px;text-align:center;font-weight:500;padding:0;border-right-color:var(--border);cursor:default}
#grid th.hs{background:var(--head-sel);color:var(--head-sel-fg);font-weight:600}
#grid th.hf{background:var(--head-sel-fg);color:var(--on-accent);font-weight:600}
#grid tr.fz td,#grid tr.fz th{position:sticky;top:24px;z-index:4;border-bottom:3px solid var(--freeze)}
#grid tr.fz th.rh{z-index:5;left:0}
#grid tr.sp td{height:auto;padding:0;border:0;background:var(--bg)}
.rz{position:absolute;right:-1px;top:0;width:7px;height:100%;cursor:col-resize;z-index:2}
.rz:hover{background:var(--accent);opacity:.6}
#grid thead th{overflow:visible}

/* selection layers */
#grid td.sel::after,#grid td.act::after{content:"";position:absolute;inset:0;pointer-events:none;border:0 solid var(--accent)}
#grid td.sel::after{background:var(--sel)}
#grid td.et::after{border-top-width:1px}
#grid td.eb::after{border-bottom-width:1px}
#grid td.el::after{border-left-width:1px}
#grid td.er::after{border-right-width:1px}
#grid td.act::after{border-width:2px}
#grid td.qt::before,#grid td.qb::before,#grid td.ql::before,#grid td.qr::before{content:"";position:absolute;inset:0;pointer-events:none;border:0 dashed var(--accent)}
#grid td.qt::before{border-top-width:2px}
#grid td.qb::before{border-bottom-width:2px}
#grid td.ql::before{border-left-width:2px}
#grid td.qr::before{border-right-width:2px}
#grid td.fm{background-color:var(--fm)}
#grid td.fc{background-color:var(--fc)}
/* note / comment corner markers */
#grid td.hn{background-image:linear-gradient(225deg,var(--note) 0 6px,transparent 6px)}
#grid td.hc{background-image:linear-gradient(225deg,var(--cmt) 0 7px,transparent 7px)}
:root{--note:#d93025;--cmt:#8430ce}
#ctip{position:fixed;display:none;z-index:90;width:280px;max-height:340px;overflow:auto;background:var(--menu);color:var(--fg);border-radius:8px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.45;pointer-events:none}
#ctip .ct-h{padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.dot.note{background:var(--note)} .dot.comment{background:var(--cmt)}
.ct-e{padding:8px 12px}
.ct-e + .ct-e{border-top:1px solid var(--line)}
.ct-e.reply{padding-left:24px}
.ct-a{font-weight:600;margin-bottom:2px}
.ct-t{white-space:pre-wrap;word-break:break-word}

/* side panel */
#main{flex:1;display:flex;min-height:0}
#main #wrap{flex:1;min-width:0}
#cpanel{width:330px;flex:none;display:none;flex-direction:column;background:var(--chrome);border-top:1px solid var(--border);border-left:1px solid var(--border);min-height:0}
#cpanel.open{display:flex}
.cp-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:14px}
.cp-head button{border:0;background:none;border-radius:4px;padding:2px 7px;cursor:default;color:var(--muted)}
.cp-head button:hover{background:var(--hover)}
.cp-filter{display:flex;gap:4px;padding:0 12px 8px}
.cp-filter button{border:1px solid var(--border);background:none;border-radius:14px;padding:3px 11px;font-size:12px;cursor:default;color:var(--muted)}
.cp-filter button.on{background:var(--btn-on);border-color:transparent;color:var(--head-sel-fg)}
#cplist{flex:1;overflow:auto;padding:0 10px 12px}
.cp-sheet{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:10px 4px 4px}
.cp-item{background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:default;overflow:hidden}
.cp-item:hover{border-color:var(--border)}
.cp-item.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cp-ref{display:flex;align-items:center;gap:6px;padding:7px 12px 0;font-size:12px;color:var(--muted)}
.cp-ref b{color:var(--fg)}
.cp-val{margin-left:auto;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-item .ct-e{padding:6px 12px}
.cp-empty{color:var(--muted);padding:24px 8px;text-align:center;line-height:1.5}
.badge{font-size:10.5px;font-weight:600;background:var(--cmt);color:#fff;border-radius:8px;padding:0 5px;margin-left:3px;line-height:15px}

#fh{position:absolute;width:8px;height:8px;background:var(--accent);border:1.5px solid var(--bg);border-radius:2px;z-index:2;cursor:crosshair;display:none}
#editor{position:absolute;display:none;z-index:3;margin:0;padding:0 3px;border:2px solid var(--accent);border-radius:0;
  background:var(--input);color:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;line-height:18px;
  resize:none;overflow:hidden;white-space:pre;outline:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#sink{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;resize:none;border:0;padding:0}

/* ---------- bottom bar ---------- */
.bottom{display:flex;align-items:center;height:38px;background:var(--chrome);border-top:1px solid var(--border);padding:0 8px;gap:6px}
#tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{border:0;background:none;border-radius:6px;padding:6px 14px;white-space:nowrap;font-weight:500;color:var(--muted);cursor:default}
#tabs button:hover{background:var(--hover)}
#tabs button.on{background:var(--btn-on);color:var(--head-sel-fg)}
#tabs .add{font-size:18px;line-height:1;padding:3px 10px;color:var(--muted)}
#stat{color:var(--muted);font-size:12px;white-space:nowrap;padding:0 8px}
#stat b{color:var(--fg);font-weight:600}

/* ---------- menus / find / toast ---------- */
#menu{position:fixed;display:none;z-index:100;min-width:220px;background:var(--menu);color:var(--fg);border-radius:8px;box-shadow:var(--shadow);padding:6px 0;font-size:13px;max-height:80vh;overflow:auto}
#menu .mi{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 8px;cursor:default;white-space:nowrap}
#menu .mi:hover{background:var(--hover)}
#menu .mi.dis{opacity:.4;pointer-events:none}
#menu .ck{width:14px;text-align:center;color:var(--accent)}
#menu .lb{flex:1}
#menu .kb{color:var(--muted);font-size:12px;margin-left:24px}
#menu .sep{height:1px;background:var(--line);margin:5px 0}
#menu .sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--border);vertical-align:-2px}
#find{position:fixed;right:18px;top:118px;z-index:50;display:none;align-items:center;gap:6px;background:var(--menu);box-shadow:var(--shadow);border-radius:8px;padding:6px 8px}
#find input{border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:4px;padding:4px 8px;font:inherit;width:220px}
#find input:focus{outline:none;border-color:var(--accent)}
#find button{border:0;background:none;border-radius:4px;padding:3px 7px;cursor:default}
#find button:hover{background:var(--hover)}
#findcount{color:var(--muted);font-size:12px;min-width:56px;text-align:right}
#toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);background:#323232;color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
#toast.show{opacity:1}
#drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(26,115,232,.12);border:3px dashed var(--accent);z-index:300;font-size:20px;color:var(--accent);pointer-events:none}
</style>
</head>
<body>
<div class="top">
  <svg class="logo" viewBox="0 0 30 34"><rect x="1" y="1" width="28" height="32" rx="4" fill="#188038"/><rect x="6" y="9" width="18" height="17" rx="1.5" fill="#fff"/><path d="M6 15h18M6 20.5h18M12.5 9v17" stroke="#188038" stroke-width="1.8"/></svg>
  <div class="titlecol">
    <div class="titlerow"><input id="title" spellcheck="false"><span id="savestate"></span></div>
    <div class="menubar" id="menubar">
      <button data-m="file">File</button><button data-m="edit">Edit</button><button data-m="view">View</button><button data-m="insert">Insert</button><button data-m="format">Format</button><button data-m="data">Data</button>
    </div>
  </div>
  <div class="themeseg" id="themeseg" role="radiogroup" aria-label="Appearance">
    <button data-t="auto" role="radio" title="Match macOS (System)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>System</span></button>
    <button data-t="light" role="radio" title="Light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span></button>
    <button data-t="dark" role="radio" title="Dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Dark</span></button>
  </div>
  <button class="gearbtn" id="infobtn" title="About MiniSheet" aria-label="About MiniSheet" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
  <button class="gearbtn" id="gearbtn" title="Settings (⌘,)" aria-label="Settings" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>
<div class="toolbar" id="toolbar">
  <button data-a="undo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button data-a="redo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <span class="sepv"></span>
  <button data-a="open" class="txt" title="Open (⌘O)"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Open</button>
  <button data-a="save" class="txt" title="Save (⌘S)"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>Save</button>
  <span class="sepv"></span>
  <button data-a="bold" title="Bold (⌘B)"><b class="glyph">B</b></button>
  <button data-a="italic" title="Italic (⌘I)"><i class="glyph">I</i></button>
  <button data-a="fill" title="Fill color"><span style="display:flex;flex-direction:column;align-items:center"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 3s6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 12 3 12 3z"/></svg><span class="swatch-bar" id="fillbar" style="background:#fef7e0"></span></span></button>
  <span class="sepv"></span>
  <button data-a="al-left" title="Align left"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
  <button data-a="al-center" title="Align center"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
  <button data-a="al-right" title="Align right"><svg viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
  <span class="sepv"></span>

/* formula reference rewriting (copy/fill/insert/delete) */
function mapFormula(f, refFn, colFn){
  return f.split(/("(?:[^"]|"")*")/).map((seg, i) => i % 2 ? seg : seg
    .replace(/(?<![A-Za-z0-9_.$])(\$?)([A-Za-z]{1,3}):(\$?)([A-Za-z]{1,3})(?![A-Za-z0-9_(])/g,
      (m, a1, c1, a2, c2) => colFn(a1, colIndex(c1), a2, colIndex(c2)) ?? m)
    .replace(/(?<![A-Za-z0-9_.$])(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![A-Za-z0-9_(])/g,
      (m, ac, cs, ar, rs) => refFn(ac, colIndex(cs), ar, +rs - 1) ?? m)
  ).join('');
}
function shiftRefs(f, dr, dc){
  return mapFormula(f,
    (ac, c, ar, r) => { const nc = ac ? c : c + dc, nr = ar ? r : r + dr; return nc < 0 || nr < 0 ? '#REF!' : ac + colName(nc) + ar + (nr + 1); },
    (a1, c1, a2, c2) => { const x = a1 ? c1 : c1 + dc, y = a2 ? c2 : c2 + dc; return x < 0 || y < 0 ? '#REF!' : a1 + colName(x) + ':' + a2 + colName(y); });
}

const clone = o => o ? {...o} : undefined;

function applyChanges(list){

    const k = key(r, c);

    setCellObj(sh, k, cell ? {v:'', ...cell} : null);

function prewarm(){

  const f = e.dataTransfer.files[0]; if (!f) return;
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  const hp = item && item.getAsFileSystemHandle ? item.getAsFileSystemHandle() : null;
  if (!confirmDiscard()) return;
  dirty = false;
  Promise.resolve(hp).then(h => loadFile(f, h && h.kind === 'file' ? h : null), () => loadFile(f, null));
});
window.addEventListener('beforeunload', () => { if (editing) commitEdit(0, 0, true); persist(); });

/* ---------------- notes & comments (read-only) ----------------
   cell.c = [{a:author, t:text, T:true?}]  — T marks an Excel threaded comment
   (first entry = the comment, the rest = replies); without T it is a classic note. */
let commentIndex = [], panelOpen = false, panelFilter = 'all', tipFrom = null;
try { panelOpen = localStorage.getItem('minisheet.panel') === '1'; } catch (e){}
const tipEl = $('#ctip'), panelEl = $('#cpanel'), cplist = $('#cplist');

function normComments(c){
  if (!Array.isArray(c) || !c.length) return null;
  let list = c.map(x => ({a:String(x.a || '').trim(), t:String(x.t ?? '').replace(/\r\n?/g, '\n'), T:!!x.T}));
  if (list.some(x => x.T)) list = list.filter(x => x.T);          // drop Excel's "[Threaded comment]" legacy copy
  for (const x of list){
    if (/^\{?[0-9A-F]{8}-[0-9A-F-]{27}\}?$/i.test(x.a)) x.a = '';  // unresolved person id
    if (!x.T && x.a && x.t.startsWith(x.a + ':')) x.t = x.t.slice(x.a.length + 1).replace(/^\s*\n/, ''); // Excel prefixes notes with "Author:"
    x.t = x.t.replace(/\s+$/, '');
    if (!x.T) delete x.T;
  }
  list = list.filter(x => x.t !== '' || x.a);
  return list.length ? list : null;
}
function entriesHtml(list){
  return list.map((x, i) => `<div class="ct-e${i && x.T ? ' reply' : ''}">${x.a ? `<div class="ct-a">${esc(x.a)}</div>` : ''}<div class="ct-t">${esc(x.t)}</div></div>`).join('');
}
function kindLabel(list){
  if (!list[0].T) return 'Note';
  const n = list.length - 1;
  return 'Comment' + (n ? ` · ${n} repl${n === 1 ? 'y' : 'ies'}` : '');
}
function refreshComments(){
  commentIndex = [];
  book.sheets.forEach((sh, si) => {
    for (const k in sh.cells){
      const cell = sh.cells[k];
      if (!cell.c || !cell.c.length) continue;
      const i = k.indexOf(',');
      commentIndex.push({si, r:+k.slice(0, i), c:+k.slice(i + 1), kind:cell.c[0].T ? 'comment' : 'note'});
    }
  });
  commentIndex.sort((a, b) => a.si - b.si || a.r - b.r || a.c - b.c);
  const badge = $('#cbadge');
  badge.hidden = !commentIndex.length; badge.textContent = commentIndex.length;
  $('#toolbar [data-a=comments]').classList.toggle('on', panelOpen);
  renderPanel();
}
function renderPanel(){
  panelEl.classList.toggle('open', panelOpen);
  if (!panelOpen) return;
  const items = commentIndex.filter(x => panelFilter === 'all' || x.kind === panelFilter);
  const nNotes = commentIndex.filter(x => x.kind === 'note').length;
  panelEl.querySelector('[data-f=all]').textContent = `All ${commentIndex.length}`;
  panelEl.querySelector('[data-f=note]').textContent = `Notes ${nNotes}`;
  panelEl.querySelector('[data-f=comment]').textContent = `Comments ${commentIndex.length - nNotes}`;
  for (const b of panelEl.querySelectorAll('.cp-filter button')) b.classList.toggle('on', b.dataset.f === panelFilter);
  if (!items.length){
    cplist.innerHTML = `<div class="cp-empty">${commentIndex.length ? 'Nothing matches this filter.' : 'No notes or comments in this workbook.<br>They appear here when you open an Excel file that has them.'}</div>`;
    return;
  }
  let h = '', lastSi = -1;
  const multi = book.sheets.length > 1;
  for (const it of items.slice(0, 2000)){
    if (multi && it.si !== lastSi){ h += `<div class="cp-sheet">${esc(book.sheets[it.si].name)}</div>`; lastSi = it.si; }
    const cell = book.sheets[it.si].cells[key(it.r, it.c)];
    const on = it.si === book.active && it.r === sel.ar && it.c === sel.ac;
    const val = cellText(it.r, it.c, it.si);
    h += `<div class="cp-item${on ? ' on' : ''}" data-si="${it.si}" data-r="${it.r}" data-c="${it.c}">
      <div class="cp-ref"><span class="dot ${it.kind}"></span><b>${refName(it.r, it.c)}</b>${esc(kindLabel(cell.c))}<span class="cp-val" title="${esc(val)}">${esc(val)}</span></div>
      ${entriesHtml(cell.c)}</div>`;
  }
  if (items.length > 2000) h += `<div class="cp-empty">Showing the first 2,000 of ${items.length}.</div>`;
  cplist.innerHTML = h;
}
function togglePanel(){
  panelOpen = !panelOpen;
  try { localStorage.setItem('minisheet.panel', panelOpen ? '1' : '0'); } catch (e){}
  refreshComments(); hideTip(); render();
}
function showTip(r, c, rect, from){
  const cell = S().cells[key(r, c)];
  if (!cell || !cell.c || !cell.c.length){ hideTip(); return; }
  tipEl.innerHTML = `<div class="ct-h"><span class="dot ${cell.c[0].T ? 'comment' : 'note'}"></span>${refName(r, c)} · ${esc(kindLabel(cell.c))}</div>${entriesHtml(cell.c)}`;
  tipEl.style.display = 'block'; tipFrom = from;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = rect.right + 6, y = rect.top;
  if (x + w > innerWidth - 8) x = Math.max(8, rect.left - w - 6);
  if (y + h > innerHeight - 8) y = Math.max(8, innerHeight - h - 8);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function hideTip(){ tipEl.style.display = 'none'; tipFrom = null; }
function tdFor(r, c){ return table.querySelector(`td[data-r="${r}"][data-c="${c}"]`); }
function onSelComment(){
  if (panelOpen){
    renderPanel();
    const on = cplist.querySelector('.cp-item.on');
    if (on){ // scroll only the panel list, never the grid or page
      const top = on.offsetTop - cplist.offsetTop, bottom = top + on.offsetHeight;
      if (top < cplist.scrollTop) cplist.scrollTop = top - 8;
      else if (bottom > cplist.scrollTop + cplist.clientHeight) cplist.scrollTop = bottom - cplist.clientHeight + 8;
    }
  }
  const R = rng(), cell = S().cells[key(sel.ar, sel.ac)];
  if (!editing && R.r1 === R.r2 && R.c1 === R.c2 && cell && cell.c && !panelOpen){
    const td = tdFor(sel.ar, sel.ac);
    if (td) return showTip(sel.ar, sel.ac, td.getBoundingClientRect(), 'sel');
  }
  if (tipFrom === 'sel') hideTip();
}
wrap.addEventListener('mouseover', e => {
  if (drag) return;
  const td = e.target.closest && e.target.closest('td.hn, td.hc');
  if (td) showTip(+td.dataset.r, +td.dataset.c, td.getBoundingClientRect(), 'hover');
  else if (tipFrom === 'hover') hideTip();
});
wrap.addEventListener('mouseleave', () => { if (tipFrom === 'hover') hideTip(); });
wrap.addEventListener('scroll', () => {
  if (tipFrom === 'hover') hideTip();
  else if (tipFrom === 'sel') requestAnimationFrame(() => { // keep the selected cell's popup attached to it
    const td = tdFor(sel.ar, sel.ac), w = wrap.getBoundingClientRect();
    const b = td && td.getBoundingClientRect();
    if (b && b.bottom > w.top + HEAD_H && b.top < w.bottom && b.right > w.left + RH_W && b.left < w.right) showTip(sel.ar, sel.ac, b, 'sel'); else hideTip();
  });
}, {passive:true});
wrap.addEventListener('mousedown', () => { if (tipFrom === 'hover') hideTip(); });
$('#cpclose').addEventListener('click', () => { togglePanel(); focusSink(); });
panelEl.addEventListener('mousedown', e => { if (!e.target.closest('.ct-t')) e.preventDefault(); });
panelEl.querySelector('.cp-filter').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  panelFilter = b.dataset.f; renderPanel();
});
cplist.addEventListener('click', e => {
  const it = e.target.closest('.cp-item'); if (!it) return;
  if (getSelection().toString()) return;          // let people select/copy comment text
  const si = +it.dataset.si, r = +it.dataset.r, c = +it.dataset.c;
  if (si !== book.active) switchSheet(si);
  setSel(r, c);
  focusSink();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.altKey && e.code === 'KeyM'){ e.preventDefault(); togglePanel(); focusSink(); }
}, true);

/* ---------------- boot ---------------- */
/* appearance: System (follows macOS) / Light / Dark — remembered between launches */
function applyTheme(t){
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { localStorage.setItem('minisheet.theme', t === 'auto' ? '' : t); } catch (e){}
  syncThemeSeg(); render(); refreshComments();
}
function setTheme(t){
  applyTheme(t);
  if (NATIVE) native({cmd:'appearance', mode:t}).catch(() => {});   // window chrome + other tabs follow
}
function syncThemeSeg(){
  const cur = document.documentElement.dataset.theme || 'auto';
  for (const b of document.querySelectorAll('#themeseg button')){ const on = b.dataset.t === cur; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); }
}
$('#themeseg').addEventListener('mousedown', e => e.preventDefault());
if (NATIVE){
  for (const [id, cmd] of [['#gearbtn', 'settings'], ['#infobtn', 'about']]){ const b = $(id); b.hidden = false; b.addEventListener('click', () => { native({cmd}).catch(() => {}); }); }
}
$('#themeseg').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ setTheme(b.dataset.t); focusSink(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
restore();
titleEl.value = book.title;
prewarm();
renderTabs(); render(); updateBar();
if (S()._scroll){ wrap.scrollLeft = S()._scroll[0]; wrap.scrollTop = S()._scroll[1]; render(); }
setInterval(() => { S()._scroll = [wrap.scrollLeft, wrap.scrollTop]; S()._sel = sel; }, 2000);
focusSink();

/* opened from Finder: MiniSheet.app stages the file as inbox/<id>.js and passes ?open=<id> */
(function openFromFinder(){
  const id = new URLSearchParams(location.search).get('open');
  if (!id || !/^\d+$/.test(id)) return;
  history.replaceState(null, '', location.pathname);
  const s = document.createElement('script');
  s.src = 'inbox/' + id + '.js';
  s.onload = () => {
    const item = window.__inbox && window.__inbox[id];
    if (!item) return;
    const bytes = b64 => Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
    const name = new TextDecoder().decode(bytes(item.n));
    if (dirty && !fileName && Object.keys(S().cells).length && !confirm(`Replace your unsaved draft “${book.title}” with ${name}?`)) return;
    dirty = false;
    loadFile(new File([bytes(item.d)], name), null);
  };
  s.onerror = () => toast('Could not open the file from Finder');
  document.body.appendChild(s);
})();
</script>
